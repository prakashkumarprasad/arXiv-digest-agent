[project]
name = "arxiv-digest-agent"
version = "0.1.0"
description = "Autonomous arXiv Digest & QA Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "openai>=1.30.0",
    "langchain-core>=0.3.0",
    "arxiv>=2.1.0",
    "pymupdf>=1.23.0",
    "pdfplumber>=0.11.0",
    "sentence-transformers>=3.0.0",
    "chromadb>=0.5.0",
    "pydantic>=2.8.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
gemini = ["google-generativeai>=0.8.0"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"
lint.select = ["E", "F", "I", "UP", "W"]